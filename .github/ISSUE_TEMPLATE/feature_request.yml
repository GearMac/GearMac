# 中文说明：功能建议模板；强调 GearMac 刻意保持精简，要求说明为什么它值得增加这份重量。
name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in GearMac?
      description: >
        GearMac stays small on purpose — quality over quantity. It has already borrowed what it
        wanted from Raycast, so "Raycast has it" is not a reason. Tell us why this is worth its
        weight.
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: >
        **Ticking this is not permission to start.** Wait until a maintainer labels this issue
        `approved` — that label is the only green light. A pull request whose linked issue isn't
        `approved` is closed automatically, unreviewed. Docs-only changes are the exception. Read
        [CONTRIBUTING.md](https://github.com/GearMac/GearMac/blob/main/CONTRIBUTING.md)
        first — it is required reading, and it is what your PR is held to.
      options:
        - label: I'm willing to implement this myself **once this issue is labelled `approved`**
          required: false
